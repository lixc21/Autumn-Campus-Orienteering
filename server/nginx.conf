limit_req_zone  $binary_remote_addr zone=orient_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=orient_conn:10m;

server {
    listen 80;
    listen 8080;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/orient/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/orient/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:orient_ssl:2m;
    ssl_session_timeout 1h;

    client_max_body_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;

    limit_req  zone=orient_ip burst=30 nodelay;
    limit_conn orient_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    error_page 429 @slow;
    error_page 502 503 504 @down;
    location @slow {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Retry-After 15 always;
        return 429 '{"ok":false,"err":"slow_down","retry":15}';
    }
    location @down {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 503 '{"ok":false,"err":"down"}';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location = /api/sync {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8090;
    }
    location = /api/ping {
        proxy_pass http://127.0.0.1:8090;
    }
    location = /api/admin {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8090;
    }

    location / { return 404; }
}
